# ==============================================================================
# CONFIGURACIÓN DE PRUEBAS AUTOMATIZADAS (JUNIT 5 / MYSQL 8.4)
# Base de datos relacional aislada para pruebas en MySQL Server
# ==============================================================================
spring.application.name=reserva-canchas-test

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/canchas_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.sql.init.mode=never
server.port=-1
