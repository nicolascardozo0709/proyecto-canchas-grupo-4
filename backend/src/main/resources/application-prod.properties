# ===================================================================
# PERFIL DE PRODUCCIÓN ENDURECIDO (PROD) - PROYECTO CANCHAS
# Activar mediante variable de entorno: SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# 1. Base de datos MySQL / MariaDB (Estricto: No defaults inseguros)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA & Hibernate para Producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 3. Consola H2 estrictamente deshabilitada
spring.h2.console.enabled=false

# 4. Seguridad JWT (Obligatorio en producción: Falla si no se define)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# 5. Restricción estricta de CORS para Producción
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://canchasjaveriana.com,https://admin.canchasjaveriana.com}

# 6. Endurecimiento de servidor Web
server.error.include-stacktrace=never
server.error.include-message=never
