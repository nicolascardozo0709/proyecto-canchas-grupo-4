# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN - PLATAFORMA DE RESERVA DE CANCHAS
# Proyecto 3 - Desarrollo de Software (Pontificia Universidad Javeriana)
# ==============================================================================
spring.application.name=reserva-canchas-backend
server.port=8080

# ------------------------------------------------------------------------------
# Perfil por defecto: H2 In-Memory (Zero-Setup / Desarrollo y Evaluación Inmediata)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:canchasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Deshabilitar inicialización SQL automática (manejada limpiamente por DataInitializer.java)
spring.sql.init.mode=never

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Configuración JWT (Seguridad)
# ------------------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# OpenAPI / Swagger UI (Accesible en http://localhost:8080/swagger-ui.html)
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuración de Logging
logging.level.com.canchas.reserva=INFO
logging.level.org.springframework.security=WARN
