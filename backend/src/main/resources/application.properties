# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN - PLATAFORMA DE RESERVA DE CANCHAS
# Proyecto 3 - Desarrollo de Software (Pontificia Universidad Javeriana)
# ==============================================================================
spring.application.name=reserva-canchas-backend
server.port=8080

# ------------------------------------------------------------------------------
# Persistencia Permanente en Disco Local (Los datos NUNCA se borran)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/canchasdb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
server.forward-headers-strategy=framework

# Deshabilitar inicialización SQL automática (manejada limpiamente por DataInitializer.java)
spring.sql.init.mode=never

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Configuración JWT (Seguridad)
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# OpenAPI / Swagger UI (Accesible en http://localhost:8080/swagger-ui.html)
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuración de Logging
logging.level.com.canchas.reserva=INFO
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------------------------
# Google AI Studio (Gemini 1.5 Flash API) - Asistente Deportivo Inteligente
# ------------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ------------------------------------------------------------------------------
# Servicio de Notificaciones por Correo Electronico (Confirmacion de Reservas)
# ------------------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.sender.name=Complejo Deportivo Javeriana
app.mail.sender.email=reservas@canchas.javeriana.edu.co
