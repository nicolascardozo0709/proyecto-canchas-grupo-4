# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN - PLATAFORMA DE RESERVA DE CANCHAS
# Proyecto 3 - Desarrollo de Software (Pontificia Universidad Javeriana)
# ==============================================================================
spring.application.name=reserva-canchas-backend
server.port=8080

# ------------------------------------------------------------------------------
# Base de Datos Relacional MySQL 8.4 (canchas_db en puerto 3306)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/canchas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

server.forward-headers-strategy=framework

# Inicialización manejada por DataInitializer.java
spring.sql.init.mode=never

# JPA / Hibernate (Motor MySQL 8)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Configuración JWT (Seguridad)
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# OpenAPI / Swagger UI (Accesible en http://localhost:8080/swagger-ui.html)
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuración de Logging
logging.level.com.canchas.reserva=INFO
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------------------------
# Google AI Studio (Gemini API) - Asistente Deportivo
# ------------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ------------------------------------------------------------------------------
# Servicio de Notificaciones por Correo Electrónico
# ------------------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.sender.name=Centro Deportivo Javeriana
app.mail.sender.email=reservas@canchas.javeriana.edu.co
