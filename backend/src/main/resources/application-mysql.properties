# ==============================================================================
# PERFIL PRODUCCIÓN / MYSQL 8 - PLATAFORMA DE RESERVA DE CANCHAS
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/canchas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate con MySQL 8 InnoDB
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar consola H2 en perfil MySQL
spring.h2.console.enabled=false
